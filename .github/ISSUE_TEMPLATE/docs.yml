name: Documentation problem
description: A page is wrong, unclear, out of date or missing something.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL, or the Storybook page title.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
