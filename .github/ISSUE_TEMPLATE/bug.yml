name: Bug report
description: Something in a component, token or the Storybook does not work as documented.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component or area
      description: For example Button, DataTable, the Theming guide, or a token.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Steps to reproduce, or a link to the Storybook page (and story) where it shows.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and assistive technology
      description: For example Firefox 140 on macOS, with VoiceOver.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The package version, or the commit of the repository you are looking at.
