# Version updates are deliberately off (open-pull-requests-limit: 0):
# dependency updates are taken by hand in a periodic refresh pass instead
# (ADR-0022). Vulnerability alerts and security updates are separate repo
# settings and stay on; `pnpm audit` in CI backstops them. See
# guidelines/02-tech-stack-and-structure.md, "Dependency vulnerability
# remediation pattern". To turn version updates back on, raise these limits
# (npm's was 10).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
