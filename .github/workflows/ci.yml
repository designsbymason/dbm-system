name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when the lockfile resolves two versions of a shared Radix package (two layer or focus stacks).
      - name: Check one copy of each shared Radix package
        run: pnpm check-radix-single-copy

      # Any documented, accepted-risk exception (e.g. a vulnerability with no patched version
      # upstream yet) is configured once in pnpm-workspace.yaml's own auditConfig.ignoreGhsas,
      # not as a flag here — pnpm audit reads it automatically, so this step and a local
      # `pnpm audit` run always agree, with no risk of the two drifting apart.
      - name: Audit dependencies
        run: pnpm audit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Packs each public package and checks the file list, `exports` (publint) and the types for ESM,
      # CommonJS and bundler consumers (@arethetypeswrong/cli). Needs the build above.
      - name: Check the packages publish correctly
        run: pnpm check-publish

      # Generates the component manifest again into a temporary folder (a schema problem, an undocumented prop, component or
      # function, or an export it cannot place fails) and requires the one the build shipped to match it. Needs the build above.
      - name: Check the component manifest
        run: pnpm check-manifest

      - name: Check per-component bundle size
        run: pnpm --filter @dbm-system/components check-component-bundle-size

      - name: Check Foundations token coverage
        run: pnpm --filter @dbm-system/components check-foundations-token-coverage

      # Warn-only (`::warning` annotations, always exits 0): the guideline docs drifting from each
      # other and from the code never fails a build. `continue-on-error` keeps a bug in the script
      # itself from doing so either.
      - name: Check guidelines
        run: pnpm --filter @dbm-system/components check-guidelines
        continue-on-error: true

      - name: Build Storybook
        run: pnpm --filter @dbm-system/components build-storybook

      - name: Check Storybook bundle size
        run: pnpm --filter @dbm-system/components check-storybook-bundle-size

      - name: Test
        run: pnpm test

  # Named for both jobs it runs, not just the original visual-regression one
  # — @storybook/addon-vitest's "storybook" test project (added 2026-08-16)
  # joined this job rather than getting its own, since it needs the exact
  # same setup (workspace build + a real Chromium via Playwright) and a
  # second full checkout/install/build cycle would just duplicate that cost.
  #
  # Pinned to ubuntu-26.04 rather than ubuntu-latest: this job installs OS
  # packages for Chromium and compares a screenshot against a baseline, so it
  # is the one job that can notice an OS change. `ubuntu-latest` moves to
  # 26.04 gradually between 2026-10-19 and 2026-11-19, so leaving it floating
  # could flip between images from one push to the next. Moved here from
  # 24.04 on 2026-10-22; the 24.04 leg was dropped the same day. After
  # 2026-11-19, return to ubuntu-latest
  # (guidelines/02-tech-stack-and-structure.md).
  browser-tests:
    name: browser-tests (ubuntu-26.04)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playwright browser
        working-directory: packages/components
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual regression tests
        working-directory: packages/components
        run: pnpm test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ubuntu-26.04
          path: packages/components/playwright-report/
          retention-days: 14

      # Runs every story — and every story's play function — as a real
      # Vitest test in that same Chromium instance. Known, already-triaged
      # findings are marked `parameters.a11y.test: "todo"` at the story
      # level (see guidelines/01-vision-and-goals.md §12); everything else
      # stays at the global `error` default, so a real new regression here
      # fails the build the same way a broken unit test already does.
      - name: Run Storybook component/interaction/a11y tests
        if: ${{ !cancelled() }}
        working-directory: packages/components
        run: pnpm test:storybook
