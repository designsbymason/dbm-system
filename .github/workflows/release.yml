# Releases (ADR-0176, ADR-0211): the Changesets action opens or updates a "Version Packages" pull request while changesets are waiting on
# main; merging that pull request makes the same action publish the four packages to npm with provenance. Publishing authenticates with
# npm's trusted publishing (OIDC, `id-token: write`), so no npm token is stored in the repository.
#
# The pull request the action opens is made with the default token, so GitHub does not run CI on it. The checks therefore run here, in
# this job, before the action can version or publish anything. The browser tests have already run on the same commit in CI.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, and never stop one that is already publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'designsbymason/dbm-system'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version commit and the tags
      pull-requests: write # the "Version Packages" pull request
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The steps that install, build and test run this repository's dependencies' code, so the token is not left in the checkout's git
          # configuration for them; the Changesets action below authenticates its own pushes with the token it is given.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # Trusted publishing needs npm 11.5.1 or newer; the Node in .nvmrc ships one, and this fails loudly if that ever stops being true.
      - name: Check the npm version
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check the packages publish correctly
        run: pnpm check-publish

      - name: Check the component manifest
        run: pnpm check-manifest

      - name: Test
        run: pnpm test

      - name: Version Packages pull request, or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
