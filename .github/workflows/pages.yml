# Combined Pages deployment (ADR-0170): the site at / and Storybook at /storybook/.
# Every push builds the docs site (apps/docs) and runs its gates: the link check on the
# site with Storybook beside it, and the accessibility scan (docs-site/02-structure.md §11).
# What is published at / is the placeholder in .github/pages/ until PUBLISH_DOCS_SITE is
# "true", which is switched on when the M1 docs core exists (docs-site/01-plan.md); Storybook
# is published at /storybook/ either way. The custom domain (dbm-system.com) is set in the
# repository's Pages settings, not by a CNAME file.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The go-live switch for the docs site at the root. "false": the placeholder stays at /.
  PUBLISH_DOCS_SITE: "false"

# Only the newest deployment matters; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the packages and the docs site (apps/docs) through Turborepo.
      - name: Build workspace packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @dbm-system/components build-storybook

      # Chromium reads the Properties tables off the rendered Storybook pages for the agent files, and runs the accessibility scan.
      - name: Install Playwright browser
        working-directory: apps/docs
        run: pnpm exec playwright install --with-deps chromium

      # The docs site with Storybook beside it, as it will be published once it goes live: the gates run on this.
      - name: Assemble the docs site with Storybook
        run: |
          mkdir -p apps/docs/_artifact
          cp -R apps/docs/dist/. apps/docs/_artifact/
          cp -R packages/components/storybook-static apps/docs/_artifact/storybook
          # The root robots.txt and sitemap.xml, from Storybook's own (the site's home page included).
          node apps/docs/scripts/assemble-seo.mjs apps/docs/_artifact --home

      # The files an agent reads (ADR-0228): a Markdown copy of every Storybook Docs page, llms.txt, llms-full.txt, manifest.json and AGENTS.md.
      - name: Write the agent files
        working-directory: apps/docs
        run: pnpm generate-agent-files _artifact

      - name: Check the links
        working-directory: apps/docs
        run: pnpm check-links _artifact

      # No scroll timeline folded into an `animation` shorthand, which current Chrome rejects whole (the theme section went blank in the build).
      - name: Check the built CSS
        working-directory: apps/docs
        run: pnpm check-css _artifact

      # The icons, the web manifest and the share image the pages announce are there, the right size and still the logo.
      - name: Check the brand assets
        working-directory: apps/docs
        run: pnpm check-brand-assets _artifact

      # The home page behaves: the mode toggle, the menus, the search, the theme section in both orders, reduced motion and a phone.
      - name: Check the home page behaves
        working-directory: apps/docs
        run: pnpm check-home-page _artifact

      # What the home page weighs, in the log and the job summary, with a warning (never a failure) past a soft limit.
      - name: Report the home page weight
        working-directory: apps/docs
        run: pnpm report-weight _artifact

      # Every Docs page of the built Storybook draws, with a heading, no errors and no failed requests (the story tests do not open MDX pages).
      - name: Check the Docs pages render
        working-directory: apps/docs
        run: pnpm check-docs-pages _artifact

      # The agent files are whole and agree with the rest: a copy of every Docs page, llms.txt and llms-full.txt in form, the package's own manifest.json and AGENTS.md.
      - name: Check the agent files
        working-directory: apps/docs
        run: pnpm check-agent-files _artifact

      - name: Check the component counts agree
        working-directory: apps/docs
        run: pnpm check-counts _artifact

      - name: Scan for accessibility
        working-directory: apps/docs
        run: pnpm check-accessibility

      # The Privacy Policy against what the site does: the files that use browser storage, the keys written, no cookies, no other origin.
      - name: Check the Privacy Policy matches what the site does
        working-directory: apps/docs
        run: pnpm check-privacy _artifact

      - name: Assemble the site
        run: |
          mkdir -p _site
          if [ "$PUBLISH_DOCS_SITE" = "true" ]; then
            cp -R apps/docs/_artifact/. _site/
          else
            cp -R .github/pages/. _site/
            cp -R packages/components/storybook-static _site/storybook
            # The placeholder root has no home page to list, but Storybook's pages are indexed (ADR-0221).
            node apps/docs/scripts/assemble-seo.mjs _site
            # The agent files are published either way: they are about Storybook's pages, not the home page.
            cp -R apps/docs/_artifact/docs apps/docs/_artifact/llms.txt apps/docs/_artifact/llms-full.txt apps/docs/_artifact/manifest.json apps/docs/_artifact/AGENTS.md _site/
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
