<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBM System</title>
<meta name="description" content="An agentic React component library for building web and enterprise applications quickly, consistently and accessibly, with a typed, token-driven API that AI coding agents and developers can both rely on. In active development; not yet published.">
<style>
:root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #595959; --link: #5b21b6; }
@media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #f2f2f2; --muted: #b3b3b3; --link: #c4b5fd; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 1rem/1.6 system-ui, sans-serif; }
main { max-width: 36rem; padding: 2rem 1rem; }
h1 { margin: 0 0 .5rem; font-size: 2rem; }
p { margin: 0 0 1rem; }
.note { color: var(--muted); }
a { color: var(--link); }
</style>
</head>
<body>
<main>
<h1>DBM System</h1>
<p>The agentic component library for people and the AI agents that build with them.</p>
<p class="note">In active development and not yet published. The documentation website is being built.</p>
<p><a href="/storybook/">Browse the component workshop (Storybook)</a> · <a href="https://github.com/designsbymason/dbm-system">Source on GitHub</a></p>
</main>
</body>
</html>
