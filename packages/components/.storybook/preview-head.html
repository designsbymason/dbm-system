<!--
  The preview iframe's head.

  Fonts: Nunito (primary) and Lora (secondary), the two families the token
  system names, are self-hosted (ADR-0215): `preview.tsx` imports the
  Fontsource files, all four weights the `weight` prop offers (400/500/600/
  700) for both, so they are bundled into Storybook and no third party is
  asked for them. They used to load from Google Fonts here. A consumer of
  the published package still supplies its own fonts (ADR-0175).

  Search engines (ADR-0221, docs-site/02-structure.md §12): the Docs pages are
  indexed and are drawn inside this frame, so the frame must stay crawlable
  and is never disallowed in robots.txt. The tag below keeps the frame from
  being a result by itself, while its content still counts for the page that
  embeds it. The manager's head (main.ts) marks story paths noindex.
-->
<meta name="robots" content="noindex, indexifembedded" />
